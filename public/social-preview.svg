<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with warm cream paper texture -->
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="#F4EDE2" stroke="#E3D7C5" stroke-width="2"/>
  
  <!-- Washi tape top banner -->
  <rect x="475" y="8" width="250" height="35" rx="3" fill="#E2BA7E" fill-opacity="0.85" transform="rotate(-1 600 25)"/>

  <!-- Batch Tag -->
  <rect x="80" y="80" width="240" height="36" rx="4" fill="#EADCC8" stroke="#DACBB5" stroke-width="1.5"/>
  <text x="200" y="103" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#4A3E31" letter-spacing="3">10TH D • 2018 BATCH</text>

  <!-- Handwritten subtitle -->
  <text x="350" y="105" font-family="cursive, sans-serif" font-size="28" font-weight="bold" fill="#C85A32">8 Years Later!</text>

  <!-- Headline -->
  <text x="80" y="200" font-family="serif" font-size="72" font-weight="bold" fill="#1F1C19">Same class.</text>
  <text x="80" y="275" font-family="serif" font-size="72" font-style="italic" font-weight="normal" fill="#C85A32">New stories.</text>

  <!-- Subtitle -->
  <text x="80" y="340" font-family="sans-serif" font-size="24" fill="#5A524A">The 10th Standard D Section, 2018 Passouts are getting back together.</text>

  <!-- Key Event Details Box -->
  <rect x="80" y="380" width="600" height="150" rx="12" fill="#FFFFFF" stroke="#E4DCCE" stroke-width="1.5"/>
  
  <!-- Date icon & text -->
  <circle cx="130" cy="455" r="24" fill="#FAF0E6"/>
  <text x="130" y="462" text-anchor="middle" font-size="22">📅</text>
  <text x="175" y="445" font-family="monospace" font-size="12" font-weight="bold" fill="#857B72" letter-spacing="1">DATE</text>
  <text x="175" y="472" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1F1C19">Saturday, 14 November 2026</text>
  <text x="175" y="495" font-family="sans-serif" font-size="14" fill="#857B72">5:00 PM IST onwards</text>

  <!-- Venue details -->
  <line x1="430" y1="405" x2="430" y2="505" stroke="#EFE8DC" stroke-width="1.5"/>
  <circle cx="470" cy="455" r="24" fill="#FAF0E6"/>
  <text x="470" y="462" text-anchor="middle" font-size="22">📍</text>
  <text x="515" y="445" font-family="monospace" font-size="12" font-weight="bold" fill="#857B72" letter-spacing="1">VENUE</text>
  <text x="515" y="472" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1F1C19">Royal Villa</text>
  <text x="515" y="495" font-family="sans-serif" font-size="14" fill="#857B72">Okketturu</text>

  <!-- Right Side Polaroid Visual -->
  <g transform="translate(740, 90) rotate(3)">
    <rect x="0" y="0" width="370" height="450" rx="4" fill="#FFFFFF" stroke="#E3D7C5" stroke-width="1.5"/>
    <rect x="20" y="20" width="330" height="320" rx="2" fill="#5C4533"/>
    <text x="185" y="160" text-anchor="middle" font-size="64">🏫❤️</text>
    <text x="185" y="220" text-anchor="middle" font-family="serif" font-size="26" font-weight="bold" fill="#FFFFFF">10th D Reunion</text>
    <text x="185" y="250" text-anchor="middle" font-family="monospace" font-size="14" fill="#F4EDE2">CLASS OF 2018</text>
    <text x="185" y="400" text-anchor="middle" font-family="cursive, sans-serif" font-size="36" font-weight="bold" fill="#201D1A">&ldquo;See you all there!&rdquo;</text>
  </g>

  <!-- Bottom Bar -->
  <text x="80" y="580" font-family="serif" font-size="18" font-weight="bold" fill="#22201E">ONCE 10TH D, ALWAYS 10TH D. ❤️</text>
  <text x="1120" y="580" text-anchor="end" font-family="monospace" font-size="14" fill="#8C8074">10TH D 2018 REUNION</text>
</svg>
